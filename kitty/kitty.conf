font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0

background #1f2328
foreground #d0d7de
selection_background #9ecbff
selection_foreground #1f2328
cursor #d0d7de

color0 #1f2328
color1 #ff7b72
color2 #7ee787
color3 #d29922
color4 #79c0ff
color5 #d2a8ff
color6 #a5d6ff
color7 #d0d7de
color8 #6e7681
color9 #ffa198
color10 #56d364
color11 #e3b341
color12 #58a6ff
color13 #bc8cff
color14 #39c5cf
color15 #f0f6fc

cursor_shape beam
cursor_blink_interval 0
scrollback_lines 10000
window_padding_width 6
enable_audio_bell no
visual_bell_duration 0.15
confirm_os_window_close 0
copy_on_select no

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+plus increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0 restore_font_size
